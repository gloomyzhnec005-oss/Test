<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Telegram Quest — MMORPG</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preload" as="image" href="assets/ui/loading.webp" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/vendor/phaser.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <!-- Заставка загрузки: держится, пока лобби не получит профиль -->
  <div id="splash" class="splash">
    <div class="splash-load"><div class="splash-bar"><i id="splashFill"></i></div><p id="splashText">Загрузка мира…</p></div>
  </div>
  <script>
    (function () {
      var p = 0, fill = document.getElementById('splashFill');
      var t = setInterval(function () { p += (92 - p) * 0.06; fill.style.width = p + '%'; }, 120);
      window.splashDone = function (msg) {
        clearInterval(t); fill.style.width = '100%';
        var el = document.getElementById('splash');
        if (msg) document.getElementById('splashText').textContent = msg;
        setTimeout(function () { el.classList.add('out'); setTimeout(function () { el.remove(); }, 600); }, msg ? 1200 : 250);
        window.splashDone = function () {};
      };
    })();
  </script>
  <!-- Лобби (выбор персонажа) -->
  <div id="lobby" class="lobby">
    <canvas id="lobbyBg" class="lobby-bg"></canvas>
    <div id="lobbyLights" class="lobby-lights"></div>
    <canvas id="lobbyFx" class="lobby-fx"></canvas>

    <img class="lobby-logo" src="assets/ui/logo.webp" alt="Telegram Quest">

    <!-- Окно 1: информация о герое -->
    <div id="heroPanel" class="l2-panel hero-panel">
      <div class="hp-row"><span class="hp-key">Имя</span><b id="lpName">—</b><button id="lpRename" class="icon-btn hidden" aria-label="Сменить имя">✏️</button></div>
      <div class="hp-row"><span class="hp-key">Герой</span><b id="lpHero">—</b><span id="lpTitle" class="hp-class"></span></div>
      <div class="hp-row"><span class="hp-key">Ур.</span><b id="lpLevel">—</b><span id="lpRarity" class="hp-rarity"></span></div>
      <div class="l2-bar"><span class="hp-key">HP</span><div class="l2-track hp"><i id="lpHpFill"></i><em id="lpHp"></em></div></div>
      <div class="l2-bar"><span class="hp-key" id="lpResKey">MP</span><div class="l2-track res"><i id="lpResFill"></i><em id="lpRes"></em></div></div>
      <div class="l2-bar"><span class="hp-key">Exp</span><div class="l2-track xp"><i id="lpXpFill"></i><em id="lpXp"></em></div></div>
    </div>

    <!-- Окна 2–6: герои на сцене -->
    <div class="platform"><div class="platform-runes"></div></div>
    <div id="stage" class="stage"></div>
    <button id="heroPrev" class="hero-arrow prev hidden" aria-label="Предыдущий герой">‹</button>
    <button id="heroNext" class="hero-arrow next hidden" aria-label="Следующий герой">›</button>
    <div id="roster" class="roster hidden"></div>

    <!-- Окно 7: начать -->
    <button id="playBtn" class="l2-btn start-btn" disabled>Начать</button>
    <p id="status" class="status"></p>

    <!-- Окно 8: меню -->
    <div class="l2-panel lobby-menu">
      <button id="menuHeroes" class="l2-btn">✨ Призыв</button>
      <button id="menuRoster" class="l2-btn hidden">👥 Мои герои</button>
      <button id="menuBg" class="l2-btn">🏰 Фон лобби</button>
      <button id="menuAdmin" class="l2-btn hidden">⚙️ Админка</button>
    </div>

    <!-- Смена имени (гость) -->
    <div id="renameBox" class="sheet hidden">
      <form id="renameForm" class="sheet-card l2-panel rename">
        <b>Имя героя</b>
        <input id="guestName" maxlength="16" placeholder="Введите имя" autocomplete="off" />
        <button class="l2-btn">Сохранить</button>
      </form>
    </div>
  </div>

  <!-- Игра -->
  <div id="game"></div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="top">
      <div class="panel stats">
        <div id="hudAva" class="hud-ava"><img id="hudAvaImg" alt=""><i id="hudAvaFrame"></i></div>
        <div class="row"><span id="lvl" class="lvl">1</span><span id="heroName"></span></div>
        <div class="bar hp"><div id="hpFill"></div><span id="hpText"></span></div>
        <div class="bar res"><div id="resFill"></div><span id="resText"></span></div>
        <div class="bar xp"><div id="xpFill"></div><span id="xpText"></span></div>
        <div id="passive" class="passive hidden"></div>
        <div class="row small"><span><img class="ui-ic" src="assets/ui/ic_coin.webp" alt=""><b id="gold">0</b></span><span><img class="ui-ic" src="assets/ui/ic_skull.webp" alt=""><b id="kills">0</b></span><span><img class="ui-ic" src="assets/ui/ic_atk.webp" alt=""><b id="dmg">0</b></span></div>
      </div>
      <canvas id="minimap" width="96" height="96"></canvas>
    </div>
    <div id="target" class="panel target hidden">
      <span id="targetName"></span>
      <div class="bar hp"><div id="targetFill"></div></div>
    </div>
    <div id="chatLog" class="chat-log"></div>
    <button id="chatBtn" class="round small-btn art"><img class="it-art" src="assets/ui/nav_chat.webp" alt="💬"><i id="chatBadge" class="chat-badge hidden"></i></button>
    <button id="potBtn" class="round small-btn art" title="Выпить зелье здоровья"><img class="it-art" src="assets/items/mat_potHp.webp" alt="🧪"></button>
    <div id="partyFrame" class="party-frame hidden"></div>
    <div id="waveBadge" class="wave-badge hidden"></div>
    <div id="zoneBanner" class="zone-banner hidden"><b></b><small></small></div>
    <button id="actBtn" class="act-btn hidden"></button>
    <div id="joystick" class="joystick"><div id="stick"></div></div>
    <button id="attackBtn" class="round attack">⚔️</button>
    <div id="skills" class="skills"></div>
    <div id="hudToast" class="hud-toast hidden"></div>
    <!-- Нижнее меню: персонаж, сумка, квесты, игра, призыв, магазин, ещё -->
    <nav id="navBar" class="nav-bar">
      <button data-nav="hero"><span><img src="assets/ui/nav_hero.webp" alt="🧙" draggable="false"></span><em>Герой</em></button>
      <button data-nav="bag"><span><img src="assets/ui/nav_bag.webp" alt="🎒" draggable="false"></span><em>Сумка</em></button>
      <button data-nav="quests"><span><img src="assets/ui/nav_quests.webp" alt="📜" draggable="false"></span><em>Квесты</em></button>
      <button data-nav="play" class="main"><span><img src="assets/ui/nav_play.webp" alt="⚔️" draggable="false"></span><em>Игра</em></button>
      <button data-nav="gacha"><span><img src="assets/ui/nav_gacha.webp" alt="🎰" draggable="false"></span><em>Призыв</em></button>
      <button data-nav="store"><span><img src="assets/ui/nav_store.webp" alt="💎" draggable="false"></span><em>Магазин</em></button>
      <button data-nav="more"><span><img src="assets/ui/nav_more.webp" alt="☰" draggable="false"></span><em>Ещё</em></button>
    </nav>
  </div>

  <!-- Окна поверх лобби и игры: призыв, городские места -->
  <div id="modals" class="modals">
    <!-- Выдвижные списки меню -->
    <div id="sheet" class="sheet hidden">
      <div class="sheet-card l2-panel">
        <div class="sheet-head"><b id="sheetTitle"></b><button id="sheetClose" class="icon-btn" aria-label="Закрыть">✕</button></div>
        <div id="sheetBody" class="sheet-body"></div>
      </div>
    </div>

    <!-- Карточка героя (после призыва) -->
    <div id="reveal" class="reveal hidden"><div class="reveal-rays"></div><div class="reveal-card l2-panel"></div></div>
    <div id="toast" class="toast hidden"></div>
    <!-- Карточка предмета -->
    <div id="itemCard" class="item-card-wrap hidden"><div class="l2-panel item-card"></div></div>
    <!-- Приглашение в группу -->
    <div id="partyInvite" class="item-card-wrap hidden"><div class="l2-panel item-card"><b></b><div class="ic-btns"><button class="l2-btn" id="piYes">Вступить</button><button class="l2-btn ghost" id="piNo">Отказаться</button></div></div></div>
    <!-- Реклама (заглушка) -->
    <div id="adOverlay" class="ad-overlay hidden"><div>📺 Реклама</div><small>Здесь будет ролик рекламной сети</small><b>15</b></div>
  </div>

  <div id="deathScreen" class="overlay hidden">
    <h2>Вы погибли</h2>
    <p>Возрождение в городе...</p>
  </div>

  <div id="chatWin" class="chat-win hidden">
    <div class="chat-card l2-panel">
      <div class="chat-head">
        <div class="chat-tabs"><button type="button" data-ch="talk" class="on">💬 Игроки</button><button type="button" data-ch="sys">📢 События</button></div>
        <button type="button" id="chatClose" class="chat-close">✕</button>
      </div>
      <div id="chatList" class="chat-list"></div>
      <div id="stickerBar" class="sticker-bar"></div>
      <form id="chatForm" class="chat-send" autocomplete="off">
        <input id="chatInput" maxlength="160" placeholder="Сообщение всем игрокам..." enterkeyhint="send" autocomplete="off" autocorrect="on" />
        <button type="submit" id="chatSend">➤</button>
      </form>
    </div>
  </div>
  <script src="js/textures.js"></script>
  <script src="js/mobart.js"></script>
  <script src="js/skins.js"></script>
  <script src="js/skillart.js"></script>
  <script src="js/itemart.js"></script>
  <script src="js/uiicons.js" defer></script>
  <script src="js/sfx.js"></script>
  <script src="js/tutorial.js"></script>
  <script src="js/herofx.js"></script>
  <script src="js/worldart.js"></script>
  <script src="js/backgrounds.js"></script>
  <script src="js/lobby.js"></script>
  <script src="js/town.js"></script>
  <script src="js/bag.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
