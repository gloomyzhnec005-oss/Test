<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Telegram Quest — MMORPG</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/vendor/phaser.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <!-- Лобби (выбор персонажа) -->
  <div id="lobby" class="lobby">
    <canvas id="lobbyBg" class="lobby-bg"></canvas>
    <div id="lobbyLights" class="lobby-lights"></div>
    <canvas id="lobbyFx" class="lobby-fx"></canvas>

    <!-- Окно 1: информация о герое -->
    <div id="heroPanel" class="l2-panel hero-panel">
      <div class="hp-row"><span class="hp-key">Имя</span><b id="lpName">—</b><button id="lpRename" class="icon-btn hidden" aria-label="Сменить имя">✏️</button></div>
      <div class="hp-row"><span class="hp-key">Ур.</span><b id="lpLevel">1</b><span id="lpClass" class="hp-class"></span></div>
      <div class="l2-bar"><span class="hp-key">HP</span><div class="l2-track hp"><i id="lpHpFill"></i><em id="lpHp"></em></div></div>
      <div class="l2-bar"><span class="hp-key" id="lpResKey">MP</span><div class="l2-track res"><i id="lpResFill"></i><em id="lpRes"></em></div></div>
      <div class="l2-bar"><span class="hp-key">Exp</span><div class="l2-track xp"><i id="lpXpFill"></i><em id="lpXp"></em></div></div>
    </div>

    <!-- Окна 2–6: герои на сцене -->
    <div class="platform"><div class="platform-runes"></div></div>
    <div id="stage" class="stage"></div>

    <!-- Окно 7: начать -->
    <button id="playBtn" class="l2-btn start-btn" disabled>Начать</button>
    <p id="status" class="status"></p>

    <!-- Окно 8: меню -->
    <div class="l2-panel lobby-menu">
      <button id="menuHeroes" class="l2-btn">👤 Персонаж</button>
      <button id="menuBg" class="l2-btn">🏰 Фон лобби</button>
    </div>

    <!-- Выдвижные списки меню -->
    <div id="sheet" class="sheet hidden">
      <div class="sheet-card l2-panel">
        <div class="sheet-head"><b id="sheetTitle"></b><button id="sheetClose" class="icon-btn" aria-label="Закрыть">✕</button></div>
        <div id="sheetBody" class="sheet-body"></div>
      </div>
    </div>

    <!-- Смена имени (гость) -->
    <div id="renameBox" class="sheet hidden">
      <form id="renameForm" class="sheet-card l2-panel rename">
        <b>Имя героя</b>
        <input id="guestName" maxlength="16" placeholder="Введите имя" autocomplete="off" />
        <button class="l2-btn">Сохранить</button>
      </form>
    </div>
    <div id="toast" class="toast hidden"></div>
  </div>

  <!-- Игра -->
  <div id="game"></div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="top">
      <div class="panel stats">
        <div class="row"><span id="lvl" class="lvl">1</span><span id="heroName"></span></div>
        <div class="bar hp"><div id="hpFill"></div><span id="hpText"></span></div>
        <div class="bar xp"><div id="xpFill"></div><span id="xpText"></span></div>
        <div class="row small"><span>💰 <b id="gold">0</b></span><span>💀 <b id="kills">0</b></span><span>🗡 <b id="dmg">0</b></span></div>
      </div>
      <canvas id="minimap" width="96" height="96"></canvas>
    </div>
    <div id="target" class="panel target hidden">
      <span id="targetName"></span>
      <div class="bar hp"><div id="targetFill"></div></div>
    </div>
    <div id="chatLog" class="chat-log"></div>
    <form id="chatForm" class="chat-form hidden"><input id="chatInput" maxlength="120" placeholder="Сообщение..." /></form>
    <button id="chatBtn" class="round small-btn">💬</button>
    <button id="exitBtn" class="round small-btn">🏠</button>
    <div id="joystick" class="joystick"><div id="stick"></div></div>
    <button id="attackBtn" class="round attack">⚔️</button>
  </div>

  <div id="deathScreen" class="overlay hidden">
    <h2>Вы погибли</h2>
    <p>Возрождение в городе...</p>
  </div>

  <script src="js/textures.js"></script>
  <script src="js/backgrounds.js"></script>
  <script src="js/lobby.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
